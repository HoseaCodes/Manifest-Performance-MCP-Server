# Fly.io deployment.
#
# Chosen over Lambda for two reasons that surfaced in testing:
#
#   1. **Headers arrive intact.** Lambda Function URLs rewrite
#      `WWW-Authenticate` to `x-amzn-Remapped-www-authenticate`, so an MCP
#      client never sees the challenge that tells it where to authenticate.
#   2. **Sessions work.** A long-lived process can hold MCP sessions in memory.
#      On Lambda each invocation may land in a different container, which forced
#      stateless mode.

app = 'workout-mcp'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # see the note below on why this machine stays up
  auto_stop_machines = 'off'
  auto_start_machines = true
  # One machine, always running.
  # 
  # The server is stateful, because a streamable-HTTP client opens an SSE
  # stream with GET and ends a session with DELETE — and a stateless server
  # answers both with 405, which reads to the client as "the connection could
  # not be set up". Sessions therefore live in this process's memory, and a
  # machine that stops between requests takes them with it.
  # 
  # So the choice is: pay for one small machine to stay up, or lose sessions
  # intermittently depending on how long the client paused. The second is not
  # a saving, it is a bug with a billing benefit.
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100

# Liveness only. It does not check the application API: a dependency being down
# is not this process being unhealthy, and conflating them makes a restart look
# like a fix.
[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '10s'
  method = 'GET'
  path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
